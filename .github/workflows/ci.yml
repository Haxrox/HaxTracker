name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force create release even if version tag already exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Test
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Run Android Lint Checks
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: Upload Debug APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: haxtracker-debug-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk

  mobile-emulator-matrix:
    name: Verify Mobile Launch (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34]
        target: [google_apis]
        arch: [x86_64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Debug APKs
        uses: actions/download-artifact@v4
        with:
          name: haxtracker-debug-apks

      - name: Run Android Mobile Emulator & Launch App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Installing HaxTracker Mobile APK..."
            adb install mobile/build/outputs/apk/debug/*.apk || adb install mobile-debug.apk
            
            echo "Launching HaxTracker Mobile Activity..."
            adb shell am start -n com.haxtech.haxtracker/.MainActivity
            
            sleep 5
            
            echo "Verifying application process is alive..."
            adb shell pidof com.haxtech.haxtracker >/dev/null || { echo "ERROR: Process died after launch!"; adb logcat -d '*:E'; exit 1; }
            echo "SUCCESS: HaxTracker Mobile is running on API level ${{ matrix.api-level }}"
            
            echo "Taking screenshot..."
            adb shell screencap -p /sdcard/launch_screen_mobile_api_${{ matrix.api-level }}.png
            adb pull /sdcard/launch_screen_mobile_api_${{ matrix.api-level }}.png .

      - name: Upload Mobile Emulator Launch Screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-screenshot-mobile-api-${{ matrix.api-level }}
          path: launch_screen_mobile_api_${{ matrix.api-level }}.png

  wear-emulator-matrix:
    name: Verify Wear OS Watch Launch (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            target: android-wear
            arch: x86
            profile: wearos_small_round
          - api-level: 34
            target: android-wear
            arch: x86_64
            profile: wearos_small_round

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Debug APKs
        uses: actions/download-artifact@v4
        with:
          name: haxtracker-debug-apks

      - name: Preinstall Wear API 30 system image (retry)
        if: matrix.api-level == 30
        run: |
          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "${SDKMANAGER_BIN}" ]; then
            for candidate in \
              "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "${candidate}" ]; then
                SDKMANAGER_BIN="${candidate}"
                break
              fi
            done
          fi
          if [ -z "${SDKMANAGER_BIN}" ]; then
            echo "sdkmanager binary not found on PATH or Android SDK cmdline-tools locations."
            exit 1
          fi
          yes | "${SDKMANAGER_BIN}" --licenses > /dev/null
          for attempt in 1 2 3; do
            echo "Installing Wear API 30 system image (attempt ${attempt}/3)..."
            if "${SDKMANAGER_BIN}" --install "system-images;android-30;android-wear;x86" --channel=0; then
              exit 0
            fi
            echo "Install attempt ${attempt} failed. Retrying after cleanup..."
            rm -rf "${ANDROID_HOME}/system-images/android-30/android-wear/x86" "${ANDROID_HOME}/.temp" || true
            sleep 10
          done
          echo "Failed to install Wear API 30 system image after 3 attempts."
          exit 1

      - name: Run Wear OS Emulator & Launch Smartwatch App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Installing HaxTracker Wear OS APK..."
            adb install wear/build/outputs/apk/debug/*.apk || adb install wear-debug.apk
            
            echo "Launching HaxTracker Wear Activity..."
            adb shell am start -n com.haxtech.haxtracker/com.haxtech.haxtracker.wear.presentation.MainActivity
            
            sleep 5
            
            echo "Verifying Wear application process is alive..."
            adb shell pidof com.haxtech.haxtracker >/dev/null || { echo "ERROR: Wear OS Process died after launch!"; adb logcat -d '*:E'; exit 1; }
            echo "SUCCESS: HaxTracker Wear is running on Wear OS API level ${{ matrix.api-level }}"
            
            echo "Taking Wear OS screenshot..."
            adb shell screencap -p /sdcard/launch_screen_wear_api_${{ matrix.api-level }}.png
            adb pull /sdcard/launch_screen_wear_api_${{ matrix.api-level }}.png .

      - name: Upload Wear Emulator Launch Screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-screenshot-wear-api-${{ matrix.api-level }}
          path: launch_screen_wear_api_${{ matrix.api-level }}.png

  ci-gate:
    name: CI Gate
    if: ${{ always() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Merge pull request')) }}
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - build-and-test
      - mobile-emulator-matrix
      - wear-emulator-matrix
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          BUILD_AND_TEST_RESULT="${{ needs.build-and-test.result }}"
          MOBILE_MATRIX_RESULT="${{ needs.mobile-emulator-matrix.result }}"
          WEAR_MATRIX_RESULT="${{ needs.wear-emulator-matrix.result }}"

          annotate_check() {
            local check_name="$1"
            local check_result="$2"
            if [[ "${check_result}" == "success" ]]; then
              echo "::notice title=CI Gate::✅ ${check_name}: ${check_result}"
            else
              echo "::error title=CI Gate::❌ ${check_name}: ${check_result}"
            fi
          }

          annotate_check "Build & Unit Test (unit tests, lint, assemble)" "${BUILD_AND_TEST_RESULT}"
          annotate_check "Verify Mobile Launch Matrix (API 26, 30, 34)" "${MOBILE_MATRIX_RESULT}"
          annotate_check "Verify Wear OS Launch Matrix (API 30, 34)" "${WEAR_MATRIX_RESULT}"

          {
            echo "## CI Gate Report"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Build & Unit Test (unit tests, lint, assemble) | ${BUILD_AND_TEST_RESULT} |"
            echo "| Verify Mobile Launch Matrix (API 26, 30, 34) | ${MOBILE_MATRIX_RESULT} |"
            echo "| Verify Wear OS Launch Matrix (API 30, 34) | ${WEAR_MATRIX_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${BUILD_AND_TEST_RESULT}" != "success" || \
                "${MOBILE_MATRIX_RESULT}" != "success" || \
                "${WEAR_MATRIX_RESULT}" != "success" ]]; then
            echo "CI Gate failed because one or more upstream jobs did not succeed."
            exit 1
          fi
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Determine Version and Release Status
        id: check_release
        run: |
          git fetch --tags origin || true
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Triggered directly by tag push: $TAG_NAME"
            echo "create_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "release_name=HaxTracker $TAG_NAME" >> $GITHUB_OUTPUT
          else
            # Extract versionName from mobile/build.gradle.kts
            VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' mobile/build.gradle.kts || echo "1.0.0")
            TAG_NAME="v${VERSION_NAME}"
            echo "Extracted version from mobile/build.gradle.kts: $VERSION_NAME -> Tag: $TAG_NAME"
            
            if git tag -l "$TAG_NAME" | grep -q "^$TAG_NAME$"; then
              echo "Tag $TAG_NAME already exists in remote."
              if [[ "${{ inputs.force_release }}" == "true" ]]; then
                echo "force_release is true. Proceeding with release."
                echo "create_release=true" >> $GITHUB_OUTPUT
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
                echo "release_name=HaxTracker $TAG_NAME" >> $GITHUB_OUTPUT
              else
                echo "Skipping release creation because tag $TAG_NAME already exists."
                echo "create_release=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "New Android release detected! Tag $TAG_NAME does not exist yet."
              echo "create_release=true" >> $GITHUB_OUTPUT
              echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              echo "release_name=HaxTracker $TAG_NAME" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build Release Bundles and APKs
        if: steps.check_release.outputs.create_release == 'true'
        run: |
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace

      - name: Prepare Release Assets
        if: steps.check_release.outputs.create_release == 'true'
        run: |
          mkdir -p release-assets
          
          # Include pre-built/committed signed bundles if present
          if [ -f "mobile/release/mobile-release.aab" ]; then
            cp mobile/release/mobile-release.aab release-assets/haxtracker-mobile-signed.aab
          fi
          if [ -f "wear/release/wear-release.aab" ]; then
            cp wear/release/wear-release.aab release-assets/haxtracker-wear-signed.aab
          fi
          
          # Include built bundles
          find mobile/build/outputs/bundle/release -name "*.aab" -exec cp {} release-assets/haxtracker-mobile-bundle.aab \; 2>/dev/null || true
          find wear/build/outputs/bundle/release -name "*.aab" -exec cp {} release-assets/haxtracker-wear-bundle.aab \; 2>/dev/null || true
          
          # Include built APKs (release and debug)
          find mobile/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/haxtracker-mobile-release.apk \; 2>/dev/null || true
          find wear/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/haxtracker-wear-release.apk \; 2>/dev/null || true
          find mobile/build/outputs/apk/debug -name "*.apk" -exec cp {} release-assets/haxtracker-mobile-debug.apk \; 2>/dev/null || true
          find wear/build/outputs/apk/debug -name "*.apk" -exec cp {} release-assets/haxtracker-wear-debug.apk \; 2>/dev/null || true
          
          echo "Files to attach to GitHub Release:"
          ls -la release-assets/

      - name: Publish GitHub Release
        if: steps.check_release.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check_release.outputs.tag_name }}
          name: ${{ steps.check_release.outputs.release_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
