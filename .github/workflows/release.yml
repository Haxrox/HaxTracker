name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment to apply
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  pull_request:
    types: [closed]
    branches: ["main"]

concurrency:
  group: android-release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: Verify main CI
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Create Release PR
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine release version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          git fetch --tags --force origin
          CURRENT_VERSION_NAME=$(sed -n 's/.*versionName = providers.gradleProperty("versionName").getOrElse("\([^"]*\)").*/\1/p' mobile/build.gradle.kts | head -n 1)
          MOBILE_VERSION_CODE=$(sed -n 's/.*versionCode = providers.gradleProperty("versionCode").*getOrElse(\([0-9][0-9]*\)).*/\1/p' mobile/build.gradle.kts | head -n 1)
          WEAR_VERSION_CODE=$(sed -n 's/.*versionCode = providers.gradleProperty("versionCode").*getOrElse(\([0-9][0-9]*\)).*/\1/p' wear/build.gradle.kts | head -n 1)
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [[ -n "${LATEST_TAG}" ]]; then
            TAG_VERSION="${LATEST_TAG#v}"
            TAG_MESSAGE=$(git for-each-ref --format='%(contents)' "refs/tags/${LATEST_TAG}")
            TAG_MOBILE_VERSION_CODE=$(printf '%s\n' "${TAG_MESSAGE}" | sed -n 's/.*Mobile version code: *\([0-9][0-9]*\).*/\1/p' | head -n 1)
            TAG_WEAR_VERSION_CODE=$(printf '%s\n' "${TAG_MESSAGE}" | sed -n 's/.*Wear OS version code: *\([0-9][0-9]*\).*/\1/p' | head -n 1)
            LEGACY_VERSION_CODE=$(printf '%s\n' "${TAG_MESSAGE}" | sed -n 's/.*Version code: *\([0-9][0-9]*\).*/\1/p' | head -n 1)
            [[ "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && CURRENT_VERSION_NAME="${TAG_VERSION}"
            [[ "${TAG_MOBILE_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]] && MOBILE_VERSION_CODE="${TAG_MOBILE_VERSION_CODE}"
            [[ -z "${TAG_MOBILE_VERSION_CODE}" && "${LEGACY_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]] && MOBILE_VERSION_CODE="${LEGACY_VERSION_CODE}"
            [[ "${TAG_WEAR_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]] && WEAR_VERSION_CODE="${TAG_WEAR_VERSION_CODE}"
          fi
          if [[ ! "${CURRENT_VERSION_NAME}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Could not parse a stable semantic version."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if [[ ! "${MOBILE_VERSION_CODE}" =~ ^[1-9][0-9]*$ || ! "${WEAR_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not parse positive mobile and Wear OS version codes."
            exit 1
          fi
          case "${RELEASE_TYPE}" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "::error::Unsupported release type: ${RELEASE_TYPE}"; exit 1 ;;
          esac
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          MOBILE_VERSION_CODE=$((MOBILE_VERSION_CODE + 1))
          WEAR_VERSION_CODE=$((WEAR_VERSION_CODE + 1))
          TAG_NAME="v${VERSION_NAME}"
          BRANCH_NAME="release/${TAG_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG_NAME} already exists."
            exit 1
          fi
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "MOBILE_VERSION_CODE=${MOBILE_VERSION_CODE}"
            echo "WEAR_VERSION_CODE=${WEAR_VERSION_CODE}"
            echo "TAG_NAME=${TAG_NAME}"
            echo "BRANCH_NAME=${BRANCH_NAME}"
          } >> "$GITHUB_ENV"

      - name: Update fallback versions
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
          WEAR_VERSION_CODE: ${{ env.WEAR_VERSION_CODE }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          replacements = {
              "mobile/build.gradle.kts": os.environ["MOBILE_VERSION_CODE"],
              "wear/build.gradle.kts": os.environ["WEAR_VERSION_CODE"],
          }
          for filename, version_code in replacements.items():
              path = Path(filename)
              content = path.read_text()
              content, name_count = re.subn(
                  r'(versionName = providers\.gradleProperty\("versionName"\)\.getOrElse\(")[^"]+("\))',
                  rf'\g<1>{os.environ["VERSION_NAME"]}\g<2>',
                  content,
              )
              content, code_count = re.subn(
                  r'(versionCode = providers\.gradleProperty\("versionCode"\)\.map\(String::toInt\)\.getOrElse\()[0-9]+(\))',
                  rf'\g<1>{version_code}\g<2>',
                  content,
              )
              if name_count != 1 or code_count != 1:
                  raise SystemExit(f"Unexpected version format in {filename}")
              path.write_text(content)
          PY

      - name: Create release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          TAG_NAME: ${{ env.TAG_NAME }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH_NAME}"
          git add mobile/build.gradle.kts wear/build.gradle.kts
          git commit --message "Prepare release ${TAG_NAME}"
          git push --set-upstream origin "${BRANCH_NAME}"
          gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "Prepare release ${TAG_NAME}" \
            --body "Updates the shared version name to ${VERSION_NAME} and increments the mobile and Wear OS version codes. Merge this PR to publish the release."

  publish:
    name: Build and Publish Merged Release
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        startsWith(github.event.pull_request.head.ref, 'release/v')
      }}

    steps:
      - name: Checkout merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Read release versions
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = providers.gradleProperty("versionName").getOrElse("\([^"]*\)").*/\1/p' mobile/build.gradle.kts | head -n 1)
          MOBILE_VERSION_CODE=$(sed -n 's/.*versionCode = providers.gradleProperty("versionCode").*getOrElse(\([0-9][0-9]*\)).*/\1/p' mobile/build.gradle.kts | head -n 1)
          WEAR_VERSION_CODE=$(sed -n 's/.*versionCode = providers.gradleProperty("versionCode").*getOrElse(\([0-9][0-9]*\)).*/\1/p' wear/build.gradle.kts | head -n 1)
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "${MOBILE_VERSION_CODE}" =~ ^[1-9][0-9]*$ || ! "${WEAR_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not parse release version metadata from the merged commit."
            exit 1
          fi
          TAG_NAME="v${VERSION_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG_NAME} already exists."
            exit 1
          fi
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "MOBILE_VERSION_CODE=${MOBILE_VERSION_CODE}"
            echo "WEAR_VERSION_CODE=${WEAR_VERSION_CODE}"
            echo "TAG_NAME=${TAG_NAME}"
          } >> "$GITHUB_ENV"

      - name: Build Release Bundles and APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "::error::Android signing secrets are required for Play Store releases."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/haxtracker-release.keystore"
          export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/haxtracker-release.keystore"
          ./gradlew :mobile:bundleRelease :mobile:assembleRelease -PversionName="${VERSION_NAME}" -PversionCode="${MOBILE_VERSION_CODE}" --stacktrace
          ./gradlew :wear:bundleRelease :wear:assembleRelease -PversionName="${VERSION_NAME}" -PversionCode="${WEAR_VERSION_CODE}" --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp mobile/build/outputs/bundle/release/mobile-release.aab release-assets/haxtracker-mobile.aab
          cp wear/build/outputs/bundle/release/wear-release.aab release-assets/haxtracker-wear.aab
          cp mobile/build/outputs/apk/release/mobile-release.apk release-assets/haxtracker-mobile.apk
          cp wear/build/outputs/apk/release/wear-release.apk release-assets/haxtracker-wear.apk

      - name: Tag merged release
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
          WEAR_VERSION_CODE: ${{ env.WEAR_VERSION_CODE }}
        run: |
          git tag --annotate "${TAG_NAME}" --message "Mobile version code: ${MOBILE_VERSION_CODE}" --message "Wear OS version code: ${WEAR_VERSION_CODE}"
          git push origin "${TAG_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: gh release create "${TAG_NAME}" release-assets/* --generate-notes --title "${TAG_NAME}"
