name: Android Release

on:
  workflow_dispatch:

concurrency:
  group: android-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: Verify main CI
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Determine Next Release Version
        run: |
          git fetch --tags --force origin
          CURRENT_VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' mobile/build.gradle.kts | head -n 1)
          CURRENT_VERSION_CODE=$(grep -oP 'versionCode\s*=\s*[^)]*\K[0-9]+' mobile/build.gradle.kts | head -n 1)
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [[ -n "${LATEST_TAG}" ]]; then
            TAG_VERSION="${LATEST_TAG#v}"
            TAG_VERSION_CODE=$(git for-each-ref --format='%(contents)' "refs/tags/${LATEST_TAG}" | grep -oP 'Version code:\s*\K[0-9]+' | head -n 1)
            if [[ "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              CURRENT_VERSION_NAME="${TAG_VERSION}"
            fi
            if [[ "${TAG_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
              CURRENT_VERSION_CODE="${TAG_VERSION_CODE}"
            fi
          fi
          if [[ ! "${CURRENT_VERSION_NAME}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Could not parse a stable semantic version."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if [[ ! "${CURRENT_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not parse a positive version code."
            exit 1
          fi
          VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
          VERSION_CODE=$((CURRENT_VERSION_CODE + 1))
          TAG_NAME="v${VERSION_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG_NAME} already exists."
            exit 1
          fi
          echo "Releasing ${CURRENT_VERSION_NAME} (${CURRENT_VERSION_CODE}) as ${VERSION_NAME} (${VERSION_CODE})."
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "TAG_NAME=${TAG_NAME}"
          } >> "$GITHUB_ENV"

      - name: Build Release Bundles and APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "::error::Android signing secrets are required for Play Store releases."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/haxtracker-release.keystore"
          export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/haxtracker-release.keystore"
          ./gradlew bundleRelease assembleRelease \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}" \
            --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp mobile/build/outputs/bundle/release/mobile-release.aab release-assets/haxtracker-mobile.aab
          cp wear/build/outputs/bundle/release/wear-release.aab release-assets/haxtracker-wear.aab
          cp mobile/build/outputs/apk/release/mobile-release.apk release-assets/haxtracker-mobile.apk
          cp wear/build/outputs/apk/release/wear-release.apk release-assets/haxtracker-wear.apk

      - name: Tag release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG_NAME}" "${GITHUB_SHA}" \
            --message "HaxTracker ${TAG_NAME}" \
            --message "Version code: ${VERSION_CODE}"
          git push origin "${TAG_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: HaxTracker ${{ env.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
